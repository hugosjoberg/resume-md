[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-md"
version = "0.1.0"
description = "Print-quality PDF resumes from a single Markdown file. Pandoc + WeasyPrint with a deliberate, themeable design system."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Hugo Sjöberg" },
]
keywords = ["resume", "cv", "pandoc", "weasyprint", "pdf", "markdown"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "typer >=0.12",
  "weasyprint >=62",
  "watchfiles >=0.21",
]

[project.optional-dependencies]
dev = [
  "pytest >=8",
  "ruff >=0.6",
]

[project.urls]
Homepage = "https://github.com/hugosjoberg/resume-md"
Issues = "https://github.com/hugosjoberg/resume-md/issues"

[project.scripts]
resume-md = "resume_md.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_md"]
artifacts = ["src/resume_md/templates/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: `typer.Option(...)` in argument defaults is the idiomatic Typer pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
